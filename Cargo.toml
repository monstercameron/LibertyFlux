[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
cipher = "0.4"
flate2 = "1"
serde_json = "1"
sha1 = "0.10"

# The unsafe rule: denied everywhere; a module that genuinely needs unsafe
# re-allows it with `#[allow(unsafe_code)]` plus a justification comment.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# This test crate compiles verified rewrites exactly as they are, and one of them reads a word at an odd
# address, which the 32-bit processor allows and a debug build's pointer-alignment check aborts on. The
# check is switched off for this crate only, so its tests run in the ordinary debug build like the others.
[profile.dev.package.lf-sounddiff]
debug-assertions = false

# This test crate compiles verified rewrites exactly as they are, and one of them writes a 64-bit word at an
# address that is four bytes past an eight-byte boundary, which the 32-bit processor allows and a debug build's
# pointer-alignment check aborts on. The check is switched off for this crate only.
[profile.dev.package.lf-25-rowdiff]
debug-assertions = false

# This test crate places verified rewrites over a region of bytes, where a rewrite's 32-bit access can fall on an
# address that is not a multiple of four; the 32-bit processor allows it and a debug build's pointer-alignment
# check aborts on it. The check is switched off for this crate only.
[profile.dev.package.lf-28-globwrdiff]
debug-assertions = false

# This test crate compiles verified rewrites exactly as they are, and they read and write words at addresses the
# 32-bit processor allows and a debug build's pointer-alignment check aborts on. The check is switched off for this
# crate only, so its tests run in the ordinary debug build like the others.
[profile.dev.package.lf-soundbase-diff]
debug-assertions = false
