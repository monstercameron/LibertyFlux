# LibertyFlux workspace.
#
# Layout:
# - crates/lf-core holds shared types (fixed-layout helpers, typed pointers,
#   the lift's boundary types) and the layout-assertion macros; the maths
#   types (vectors, matrices, quaternions) are in crates/lf-math.
# - crates/lf-<subsystem> hold the engine subsystems. Portable rewrite code
#   lives in each crate root; fixed 32-bit memory layouts live in its
#   `layout` module (see layout-convention.md in the lane notes; tracked
#   copy to be decided by the coordinator).
# - crates/lf-formats holds format-reader support. Per-format reader crates
#   from the fmt-* lanes live beside lf-formats in crates/formats/ and are
#   members below. (lf-sco is the compiled-script reader; lf-script is the
#   engine script subsystem. Unfinished lanes will add lf-anim, lf-audio-
#   banks, lf-cutscene, lf-particle and lf-vehicle-meta beside them.)
# - crates/lf-platform is the OS interface (traits only, no implementation
#   yet). All platform-specific code hangs off it; `cfg(target_os)` appears
#   nowhere else.
# - crates/lf-rewrite-32 is the 32-bit replacement DLL injected into the
#   running game during the rewrite. Only its i686 build ever ships.
# - crates/tools/ holds the project's own tools, integrated by lane i-tools
#   from the k-checker2 (checker v2), h-loader, h-queue, h-capture and
#   p0-ghidra-scripts lanes:
#   - lf-checker-worker: the 32-bit comparison worker (driven by
#     scripts/checker/checker2.py). Only its i686 build ever runs.
#   - lf-checker-rt: the tiny runtime rewrite DLLs link against.
#   - lf-checker-proofs: the checker's proof rewrites + mutants (the
#     regression test; builds with RUSTFLAGS="-C panic=abort").
#   - lf-hook, lf-registry: the replacement loader's hook engine and
#     replacement table.
#   - lf-proxy: the system-library proxy DLL hosting the loader (cdylib,
#     only its i686 build ever ships).
#   - lf-test-target: the loader's 32-bit live test binary.
#
# Rules (see AGENTS.md): no `unsafe` outside modules that re-allow it with a
# justification comment; shared structure data changes need coordinator
# review; lf-rewrite-32 and every crate under crates/tools/ are never
# dependencies of engine crates; nothing here may contain original game
# code, only new Rust.

[workspace]
resolver = "2"
members = [
    "crates/lf-core",
    "crates/lf-types-draft",
    "crates/lf-script",
    "crates/lf-streaming",
    "crates/lf-physics",
    "crates/lf-animation",
    "crates/lf-vehicles",
    "crates/lf-peds-tasks",
    "crates/lf-audio",
    "crates/lf-input-frontend",
    "crates/lf-network",
    "crates/lf-world",
    "crates/lf-main-loop",
    "crates/lf-files-memory",
    "crates/lf-renderer",
    "crates/lf-formats",
    "crates/lf-platform",
    "crates/lf-math",
    "crates/lf-rewrite-32",
    "crates/lf-lift-pilot",
    "crates/lf-lift",
    "crates/lf-leaderboard",
    "crates/lf-script-natives",
    "crates/lf-dxso-spirv",
    "crates/tools/lf-checker-worker",
    "crates/tools/lf-checker-rt",
    "crates/tools/lf-checker-proofs",
    "crates/tools/lf-hook",
    "crates/tools/lf-registry",
    "crates/tools/lf-proxy",
    "crates/tools/lf-test-target",
    "crates/tools/lf-inspect",
    "crates/tools/lf-viewer",
    "crates/tools/lf-lift-diff",
    "crates/tools/lf-animchan-diff",
    "crates/tools/lf-voicediff",
    "crates/tools/lf-evthandler-diff",
    "crates/tools/lf-tokendiff",
    "crates/tools/lf-sounddiff",
    "crates/tools/lf-taskdiff",
    "crates/tools/lf-uiclip-diff",
    "crates/tools/lf-x87-probe",
    "crates/formats/lf-archive",
    "crates/formats/lf-resource",
    "crates/formats/lf-model",
    "crates/formats/lf-texture",
    "crates/formats/lf-collision",
    "crates/formats/lf-nav",
    "crates/formats/lf-text",
    "crates/formats/lf-gamedata",
    "crates/formats/lf-mapdata",
    "crates/formats/lf-sco",
    "crates/formats/lf-shaderpack",
    "crates/formats/lf-audio-config",
    "crates/formats/lf-save",
    "crates/formats/lf-anim",
    "crates/formats/lf-audio-bank",
    "crates/formats/lf-cutscene",
    "crates/formats/lf-effects",
    "crates/formats/lf-entity-meta",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
cipher = "0.4"
flate2 = "1"
serde_json = "1"
sha1 = "0.10"

# The unsafe rule: denied everywhere; a module that genuinely needs unsafe
# re-allows it with `#[allow(unsafe_code)]` plus a justification comment.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# This test crate compiles verified rewrites exactly as they are, and one of them reads a word at an odd
# address, which the 32-bit processor allows and a debug build's pointer-alignment check aborts on. The
# check is switched off for this crate only, so its tests run in the ordinary debug build like the others.
[profile.dev.package.lf-sounddiff]
debug-assertions = false
