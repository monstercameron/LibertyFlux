# cargo-deny configuration. Check locally with `cargo deny check`
# (install: `cargo install cargo-deny`; CI does not run it yet).
#
# Policy: permissive licences only (MIT, Apache-2.0, BSD, Zlib, plus the
# equivalent ISC and Unicode licences). Anything else fails the check and
# needs owner review with an explicit [[licenses.exceptions]] entry.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
unmaintained = "warn"

[licenses]
unlicensed = "deny"
# Fail closed: without this, OSI/FSF-approved copyleft licences would pass
# even though they are absent from `allow` below.
allow-osi-fsf-free = "neither"
copyleft = "warn"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]
# Deliberately NOT allowed: MPL-2.0 (symphonia), LGPL-2.0-only,
# LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
# GPL-*, AGPL-*. Each needs owner sign-off first (see t-engine-crates).

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
