[package]
name = "lf-proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published to crates.io; path dependencies between the project's crates rely on it.
publish = false

[lib]
name = "lf_proxy"
crate-type = ["cdylib"]

[dependencies]
lf-hook = { path = "../lf-hook" }
lf-registry = { path = "../lf-registry" }

[lints]
workspace = true
