[package]
name = "lf-rewrite-32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published to crates.io; path dependencies between the project's crates rely on it.
publish = false

[lib]
# The shippable artefact is the 32-bit DLL assembled by
# scripts/assemble/assemble.py (`lf_rewrites.dll`), which links this crate
# as an rlib and re-exports its `lf_rewrite_*` symbols. A cdylib here would
# be a library with no table, and every shard build would link it for
# nothing.
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
lf-core = { path = "../lf-core" }
# The runtime every rewrite is written against; `lf_rewrite_init` sets its
# relocation base.
lf-checker-rt = { path = "../tools/lf-checker-rt" }
# The replacement-table ABI shared with the loader.
lf-registry = { path = "../tools/lf-registry" }
